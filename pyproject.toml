[project]
name = "astro-datalake"
version = "0.1.0"
description = "Local astronomical data lake: pull, normalize, and organize public astronomy data by object/system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "tqdm>=4.66",
    "polars>=1.6",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "astropy>=6.1",
    "astroquery>=0.4.7",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.22",
]

[project.scripts]
astro = "astro_datalake.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astro_datalake"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
